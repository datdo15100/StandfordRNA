<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px 'DejaVu Sans',Arial;fill:#102a56}
      .h{font:700 20px 'DejaVu Sans',Arial;fill:#16335d}
      .t{font:16px 'DejaVu Sans',Arial;fill:#24344d}
      .s{font:14px 'DejaVu Sans',Arial;fill:#475569}
      .box{stroke:#2563eb;stroke-width:2;rx:16;ry:16}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">Pipeline cuối: một đường chạy, hai nguồn candidate, một cổng an toàn</text>

  <rect x="40" y="105" width="220" height="130" class="box" fill="#dbeafe"/>
  <text x="150" y="140" text-anchor="middle" class="h">INPUT</text>
  <text x="150" y="172" text-anchor="middle" class="t">RNA sequence</text>
  <text x="150" y="198" text-anchor="middle" class="t">temporal cutoff</text>
  <text x="150" y="220" text-anchor="middle" class="s">không có native structure</text>

  <path d="M260 170 H330" class="arrow"/>
  <circle cx="366" cy="170" r="36" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="366" y="176" text-anchor="middle" class="h">T</text>
  <path d="M402 170 H455" class="arrow"/>

  <rect x="455" y="80" width="255" height="180" class="box" fill="#e0f2fe"/>
  <text x="582" y="116" text-anchor="middle" class="h">TBM</text>
  <text x="582" y="148" text-anchor="middle" class="t">MMseqs k=13</text>
  <text x="582" y="174" text-anchor="middle" class="t">+ exhaustive composite</text>
  <text x="582" y="200" text-anchor="middle" class="t">+ temporal/self filter</text>
  <text x="582" y="226" text-anchor="middle" class="t">+ align/transfer/gap-fill</text>
  <text x="582" y="248" text-anchor="middle" class="s">tối đa 3 raw templates</text>

  <path d="M260 350 H330" class="arrow"/>
  <circle cx="366" cy="350" r="36" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="366" y="356" text-anchor="middle" class="h">P</text>
  <path d="M402 350 H455" class="arrow"/>

  <rect x="455" y="285" width="255" height="130" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="582" y="321" text-anchor="middle" class="h">PRETRAINED</text>
  <text x="582" y="353" text-anchor="middle" class="t">DRfold2 frozen model</text>
  <text x="582" y="379" text-anchor="middle" class="t">learned restraints → fold</text>
  <text x="582" y="402" text-anchor="middle" class="s">tối đa 2 raw predictions</text>

  <path d="M710 170 C770 170 760 280 820 280" class="arrow"/>
  <path d="M710 350 C770 350 760 300 820 300" class="arrow"/>
  <rect x="820" y="205" width="245" height="170" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="942" y="240" text-anchor="middle" class="h">CANDIDATE BANK</text>
  <text x="942" y="270" text-anchor="middle" class="t">3 TBM + 2 DRfold2</text>
  <text x="942" y="298" text-anchor="middle" class="t">cùng contract [L,3]</text>
  <text x="942" y="326" text-anchor="middle" class="t">confidence + support mask</text>
  <text x="942" y="352" text-anchor="middle" class="s">raw parent luôn được giữ</text>

  <path d="M1065 290 H1120" class="arrow"/>
  <rect x="1120" y="190" width="240" height="200" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1240" y="228" text-anchor="middle" class="h">GEOMETRY v2</text>
  <text x="1240" y="260" text-anchor="middle" class="t">source anchor mạnh</text>
  <text x="1240" y="288" text-anchor="middle" class="t">backbone + clash + Rg</text>
  <text x="1240" y="316" text-anchor="middle" class="t">angle + torsion priors</text>
  <text x="1240" y="344" text-anchor="middle" class="t">kink regression guard</text>
  <text x="1240" y="370" text-anchor="middle" class="s">đánh giá cả TM và C1′-lDDT</text>

  <path d="M1240 390 V455" class="arrow"/>
  <polygon points="1240,455 1360,540 1240,625 1120,540" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1240" y="510" text-anchor="middle" class="h">GEOFUSE GATE</text>
  <text x="1240" y="538" text-anchor="middle" class="t">cùng global fold?</text>
  <text x="1240" y="565" text-anchor="middle" class="t">P(pretrained tốt) ≥ 0.90</text>
  <text x="1240" y="590" text-anchor="middle" class="t">≥ 7 residue liên tục?</text>

  <path d="M1120 540 H995" class="arrow"/>
  <rect x="735" y="470" width="260" height="140" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="865" y="506" text-anchor="middle" class="h">ABSTAIN</text>
  <text x="865" y="538" text-anchor="middle" class="t">không đủ bằng chứng</text>
  <text x="865" y="566" text-anchor="middle" class="t">không ghép cưỡng ép</text>
  <text x="865" y="590" text-anchor="middle" class="s">trả lại raw parents an toàn</text>
  <text x="1054" y="522" class="s">Không</text>

  <path d="M1240 625 V676 H1035" class="arrow"/>
  <rect x="1035" y="650" width="325" height="100" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1198" y="687" text-anchor="middle" class="h">SELECTIVE FUSION</text>
  <text x="1198" y="717" text-anchor="middle" class="t">chỉ thay segment đã qua gate</text>
  <text x="1270" y="642" class="s">Có</text>

  <path d="M865 610 V700 H685" class="arrow"/>
  <path d="M1035 700 H955" class="arrow"/>
  <rect x="455" y="645" width="230" height="110" class="box" fill="#dbeafe"/>
  <text x="570" y="680" text-anchor="middle" class="h">FINAL FIVE</text>
  <text x="570" y="710" text-anchor="middle" class="t">quality + fold diversity</text>
  <text x="570" y="736" text-anchor="middle" class="s">best-of-5 submission</text>

  <path d="M455 700 H345" class="arrow"/>
  <rect x="80" y="650" width="265" height="110" class="box" fill="#e0f2fe"/>
  <text x="212" y="687" text-anchor="middle" class="h">submission.csv</text>
  <text x="212" y="718" text-anchor="middle" class="t">5 × L × C1′(x,y,z)</text>
  <text x="212" y="744" text-anchor="middle" class="s">ID/order/finite sanity-check</text>
</svg>
